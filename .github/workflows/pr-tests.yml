name: PR Tests

on:
  pull_request:
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: tandotests

jobs:
  fast_tests:
    name: Fast Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run fast tests
        run: dotnet test --project Plugins/BTCPayServer.Plugins.Tando.Tests --filter-trait "FastTest=FastTest" --report-xunit-trx --report-xunit-trx-filename fast-tests.trx --results-directory /tmp/TestResults

      - name: Fail if no tests ran
        run: bash .github/scripts/assert-tests-ran.sh /tmp/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tests-results
          path: /tmp/TestResults
          if-no-files-found: ignore

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Postgres, NBXplorer, regtest bitcoind, and the merchant/customer Lightning
      # nodes - same stack docs/Setup.md has contributors bring up locally.
      - name: Start regtest dependencies
        run: |
          cd btcpayserver/BTCPayServer.Tests
          chmod +x *.sh
          docker compose up -d dev

      - name: Run integration tests
        run: dotnet test --project Plugins/BTCPayServer.Plugins.Tando.Tests --filter-trait "Category=Integration" --report-xunit-trx --report-xunit-trx-filename integration-tests.trx --results-directory /tmp/TestResults/integration

      - name: Fail if no tests ran
        run: bash .github/scripts/assert-tests-ran.sh /tmp/TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-results
          path: /tmp/TestResults
          if-no-files-found: ignore

      - name: Tear down dependencies
        if: always()
        run: |
          cd btcpayserver/BTCPayServer.Tests
          docker compose down -v

  playwright_tests:
    name: Playwright Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start regtest dependencies
        run: |
          cd btcpayserver/BTCPayServer.Tests
          chmod +x *.sh
          docker compose up -d dev

      - name: Build test project (needed before installing Playwright browsers)
        run: dotnet build Plugins/BTCPayServer.Plugins.Tando.Tests

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_PS1=$(find Plugins/BTCPayServer.Plugins.Tando.Tests/bin -name "playwright.ps1" | head -n 1)
          pwsh "$PLAYWRIGHT_PS1" install --with-deps chromium

      - name: Run Playwright tests
        run: dotnet test --project Plugins/BTCPayServer.Plugins.Tando.Tests --no-build --filter-trait "Category=PlaywrightUITest" --report-xunit-trx --report-xunit-trx-filename playwright-tests.trx --results-directory /tmp/TestResults/playwright

      - name: Fail if no tests ran
        run: bash .github/scripts/assert-tests-ran.sh /tmp/TestResults/playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tests-results
          path: /tmp/TestResults
          if-no-files-found: ignore

      - name: Tear down dependencies
        if: always()
        run: |
          cd btcpayserver/BTCPayServer.Tests
          docker compose down -v
